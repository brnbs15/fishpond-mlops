name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: pre-commit hooks (flake8, pyright strict, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pip install --no-deps -e .
      - name: Run pre-commit hooks
        run: |
          source .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests + coverage (>= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pip install --no-deps -e .
      - name: Run pytest with coverage
        run: |
          source .venv/bin/activate
          pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: docker image build + smoke test
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build
      - name: Smoke test image
        run: |
          docker run --rm fishpond:latest python -c "import fishpond.api, fishpond.training, fishpond.monitoring; print('ok')"
          docker run --rm fishpond:latest mlflow --version
