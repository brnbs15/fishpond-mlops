# The whole stack starts with a single `docker compose up` command.
#   MLflow UI ........ http://localhost:5000
#   REST API (Swagger) http://localhost:8000/docs
#   Streamlit ........ http://localhost:8501
#   Airflow .......... http://localhost:8080

x-fishpond-env: &fishpond-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  FISHPOND_API_URL: http://api:8000
  FISHPOND_RAW_DATA: /app/data/raw/fish_pond_sample.csv
  FISHPOND_PROCESSED_DATA: /app/data/processed/fish_pond_clean.csv
  FISHPOND_PREDICTION_LOG: /app/runtime/predictions.csv
  GIT_PYTHON_REFRESH: quiet  # no git inside the containers; silences the MLflow warning

services:
  mlflow:
    build: .
    image: fishpond:latest
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    image: fishpond:latest
    pull_policy: never  # built once by the mlflow service
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      <<: *fishpond-env
      FISHPOND_AUTO_TRAIN: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  streamlit:
    image: fishpond:latest
    pull_policy: never  # built once by the mlflow service
    depends_on:
      api:
        condition: service_healthy
    environment: *fishpond-env
    command: >
      streamlit run streamlit_app/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
      --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow:
    image: apache/airflow:3.0.6-python3.11
    command: standalone
    depends_on:
      api:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      PYTHONPATH: /opt/airflow/fishpond_src
      FISHPOND_API_URL: http://api:8000
      FISHPOND_DRIFT_SHARE_THRESHOLD: "0.5"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/fishpond_src:ro
      - airflow-data:/opt/airflow
    restart: unless-stopped

volumes:
  mlflow-data:
  runtime:
  airflow-data:
