# Install once with `pre-commit install --hook-type pre-commit --hook-type pre-push`.
# The same hooks run in GitHub Actions (.github/workflows/ci.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^dvc.lock$  # generated by DVC, keep it byte-identical
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: flake8
        name: flake8 (PEP8, max line length 120)
        entry: flake8
        language: system
        types: [python]

      - id: pyright
        name: pyright (strict mode, src/)
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: pytest + coverage (>= 95%)
        entry: pytest --cov --cov-report=term-missing -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
